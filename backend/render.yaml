services:
  - type: web
    name: nexus-edu-backend
    env: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: >
      pip install -r requirements.txt &&
      python -c "
      from sentence_transformers import SentenceTransformer, CrossEncoder;
      print('Downloading embedding model...');
      SentenceTransformer('BAAI/bge-small-en-v1.5');
      print('Downloading reranker model...');
      CrossEncoder('cross-encoder/ms-marco-MiniLM-L-6-v2');
      print('Models ready.')
      "
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: APP_NAME
        value: NEXUS_EDU
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"
      - key: UPLOAD_DIR
        value: app/storage/uploads
      - key: GENERATED_DIR
        value: app/storage/generated
      - key: TEMP_DIR
        value: app/storage/temp
      - key: CHROMA_PERSIST_DIR
        value: app/storage/chromadb
      - key: CORS_ORIGINS
        value: https://nexus-ai-1-cmi1.onrender.com,https://nexus-ai-a1-cmi1.onrender.com,http://localhost:5173,http://127.0.0.1:5173
      # ── REQUIRED SECRETS — set these in the Render dashboard (Environment tab) ─
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_SYNC
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
